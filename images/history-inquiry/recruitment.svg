<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><title>科举及选官的现代简明释读，并列标识门荫等其他渠道</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#96703b"/></marker></defs><g font-family="Noto Serif SC,SimSun,serif" fill="#493522"><text x="58" y="55" font-size="34" >入仕道路，并非一途</text><text x="58" y="84" font-size="19" >以科举路径为主线 · 不代表人人必经的统一程序</text><path d="M58 108H837" stroke="#a18355"/><path d="M148 162V185M148 280V323" stroke="#a48653"/><circle cx="148" cy="236" r="50" fill="#e5d4b4" stroke="#977745" stroke-width="1.4"/><text x="148" y="248" font-size="30" text-anchor="middle">应举</text><text x="148" y="361" font-size="21" text-anchor="middle">生徒 · 乡贡</text><path d="M205 236H277" stroke="#96703b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M338 162V185M338 280V323" stroke="#a48653"/><circle cx="338" cy="236" r="50" fill="#e5d4b4" stroke="#977745" stroke-width="1.4"/><text x="338" y="248" font-size="30" text-anchor="middle">及第</text><text x="338" y="361" font-size="21" text-anchor="middle">取得出身资格</text><path d="M395 236H467" stroke="#96703b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 162V185M528 280V323" stroke="#a48653"/><circle cx="528" cy="236" r="50" fill="#e5d4b4" stroke="#977745" stroke-width="1.4"/><text x="528" y="248" font-size="30" text-anchor="middle">铨选</text><text x="528" y="361" font-size="21" text-anchor="middle">通常尚需选授</text><path d="M585 236H657" stroke="#96703b" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M718 162V185M718 280V323" stroke="#a48653"/><circle cx="718" cy="236" r="50" fill="#e5d4b4" stroke="#977745" stroke-width="1.4"/><text x="718" y="248" font-size="30" text-anchor="middle">授官</text><text x="718" y="361" font-size="21" text-anchor="middle">进入官职</text><path d="M148 421H772V445" stroke="#9d8257" fill="none" stroke-dasharray="5 6"/><text x="85" y="466" font-size="25" >门荫等其他途径</text><text x="85" y="502" font-size="21" >选官同时存在多种渠道；及第并不等于立即授官。</text><text x="85" y="552" font-size="20" >史料线索：《新唐书》卷四十四、四十五 · 选举志</text></g></svg>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budarina</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    overflow-x: hidden;
    font-family: 'Noto Serif SC', 'Rubik', serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #f5f0e8;
  }

  /* ---------- Root hero ---------- */
  .hero-section {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  /* ---------- Background (z-0) ---------- */
  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-color: #f5f0e8;
    background-image: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260730_103554_db418202-7c49-4723-bd53-35a30b7e29da.png&w=1280&q=85');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ---------- Cloth / physics container (z-20) ---------- */
  .cloth-container {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 3vh;
  }
  .roof-img {
    position: relative;
    z-index: 30;
    max-width: 78%;
    max-height: 40vh;
    object-fit: contain;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .cloth-canvas {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: auto;
    display: block;
  }
  @media (max-width: 1023px) {
    .cloth-container { padding-top: 3vh; }
    .roof-img { max-width: 85%; }
  }
  @media (max-width: 639px) {
    .cloth-container { padding-top: 3vh; }
    .roof-img { max-width: 90%; }
  }

  /* ---------- Corner text blocks (z-30) ---------- */
  .corner {
    position: absolute;
    z-index: 30;
    pointer-events: none;
  }
  .corner-tl { bottom: 1.5rem; left: 1.5rem; }
  .corner-tr { bottom: 1.5rem; right: 1.5rem; text-align: right; }

  .corner-tl .subtitle {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.8rem;
    color: #B3483C;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    white-space: nowrap;
  }
  .calligraphy {
    display: flex;
    flex-direction: row-reverse;
    gap: 0.25rem;
  }
  .calligraphy .col {
    display: flex;
    flex-direction: column;
    font-family: 'Noto Serif SC', serif;
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1.15;
    color: #B3483C;
  }
  .corner-tr .lines {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.85rem;
    color: #B3483C;
    line-height: 1.8;
    margin-bottom: 1rem;
  }
  .about-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.375rem;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: #B3483C;
  }
  .about-square {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1rem;
    height: 1rem;
    border: 1.5px solid #B3483C;
    font-size: 0;
  }

  @media (max-width: 768px) {
    .calligraphy .col { font-size: 1.5rem; }
  }
  @media (max-width: 640px) {
    .corner-tl .subtitle { font-size: 0.65rem; }
    .calligraphy .col { font-size: 1.25rem; }
  }
  @media (min-width: 768px) {
    .corner-tl { top: 7rem; left: 3rem; bottom: auto; }
    .corner-tr { top: 7rem; right: 3rem; bottom: auto; }
  }

  /* ---------- Mobile overlay (z-40) ---------- */
  .mobile-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,0.3);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .mobile-overlay.open { opacity: 1; visibility: visible; }

  /* ---------- Mobile menu (z-50) ---------- */
  .mobile-menu {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 50;
    width: 75%;
    max-width: 320px;
    height: 100dvh;
    background: #f5f0e8;
    box-shadow: -8px 0 32px rgba(0,0,0,0.1);
    padding: 6rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .mobile-menu.open { transform: translateX(0); }
  .menu-link {
    display: block;
    font-family: 'Rubik', sans-serif;
    font-size: 1.25rem;
    color: #B3483C;
    text-decoration: none;
    padding: 1.25rem 0;
    border-bottom: 1px solid rgba(122, 51, 42, 0.1);
    opacity: 0;
    transform: translateX(20px);
  }
  .mobile-menu.open .menu-link:nth-child(1) { animation: menuLinkIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) 0.1s forwards; }
  .mobile-menu.open .menu-link:nth-child(2) { animation: menuLinkIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) 0.15s forwards; }
  .mobile-menu.open .menu-link:nth-child(3) { animation: menuLinkIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) 0.2s forwards; }
  @keyframes menuLinkIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 0.85; transform: translateX(0); }
  }
  .menu-divider {
    height: 1px;
    background: rgba(122, 51, 42, 0.15);
    margin: 1.5rem 0;
    flex: none;
  }
  .mobile-menu .play-btn { width: 100%; flex: none; }

  /* ---------- Top nav (z-55) ---------- */
  .top-nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 55;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 1.5rem;
  }
  .brand {
    font-family: 'Rubik', sans-serif;
    font-size: 1.125rem;
    font-weight: 500;
    color: #B3483C;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 1.5rem;
  }
  .nav-center a {
    font-family: 'Rubik', sans-serif;
    font-size: 0.875rem;
    color: #B3483C;
    letter-spacing: 0.03em;
    text-decoration: none;
    opacity: 0.8;
    transition: color 0.3s, opacity 0.3s;
  }
  .nav-center a:hover { opacity: 1; }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* Play button (textured terracotta) */
  .play-btn {
    font-family: 'Rubik', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: #f5f0e8;
    padding: 1.125rem 2.75rem;
    border: none;
    border-radius: 0;
    background: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260731_141002_84f92c33-a221-4bfc-a798-d20db56f38a6.png&w=1280&q=85') center / cover no-repeat;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .play-btn:hover { opacity: 0.85; }

  /* Hamburger (below md only) */
  .hamburger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .bar-wrap {
    height: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .bar {
    display: block;
    width: 1.5rem;
    height: 2px;
    background: #B3483C;
    border-radius: 2px;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .hamburger.open .bar-1 { transform: translateY(7px) rotate(45deg); }
  .hamburger.open .bar-2 { opacity: 0; transform: scaleX(0); }
  .hamburger.open .bar-3 { transform: translateY(-7px) rotate(-45deg); }

  @media (min-width: 640px) { .top-nav { padding: 1.25rem 2rem; } }
  @media (min-width: 768px) {
    .top-nav { padding: 1.5rem 3rem; }
    .nav-center { display: flex; }
    .hamburger { display: none; }
  }
  @media (max-width: 639px) { .desktop-play { display: none; } }

  /* ---------- Poem switcher ---------- */
  .poem-switcher {
    position: fixed;
    left: 2.2rem;
    bottom: 1.5rem;
    z-index: 55;
    display: flex;
    flex-direction: row;
    gap: 0.25rem;
    padding: 0.4rem 0.4rem;
    background: rgba(245, 240, 232, 0.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .poem-btn {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.85rem;
    color: #B3483C;
    background: none;
    border: none;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    border-radius: 999px;
    opacity: 0.65;
    white-space: nowrap;
    transition: all 0.3s;
  }
  .poem-btn:hover { opacity: 1; }
  .poem-btn.active { background: #B3483C; color: #f5f0e8; opacity: 1; }

  .sound-hint {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 56;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.85rem;
    color: #B3483C;
    letter-spacing: 0.1em;
    padding: 0.5rem 1.1rem;
    background: rgba(245, 240, 232, 0.8);
    border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.6s;
  }
  .sound-hint.hide { opacity: 0; }

  /* ---------- Top nav ---------- */
  .topnav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.4rem 2rem;
  }
  .topnav .brand {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.125rem;
    font-weight: 500;
    color: #B3483C;
    letter-spacing: 0.06em;
  }
  .topnav .nav-links {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2.5rem;
  }
  .topnav .nav-links a {
    font-family: 'Rubik', sans-serif;
    font-size: 0.875rem;
    color: #B3483C;
    letter-spacing: 0.03em;
    opacity: 0.8;
    text-decoration: none;
    transition: opacity 0.3s;
    cursor: pointer;
  }
  .topnav .nav-links a:hover { opacity: 1; }

  /* ---------- Left hero calligraphy ---------- */
  .left-hero {
    position: fixed;
    left: 2.2rem;
    top: 27vh;
    z-index: 54;
    pointer-events: none;
  }
  .left-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.85rem;
    color: #B3483C;
    letter-spacing: 0.04em;
    margin-bottom: 1.4rem;
  }
  .left-calligraphy {
    display: flex;
    flex-direction: row-reverse;
    gap: 0.5rem;
  }
  .left-calligraphy .col {
    display: flex;
    flex-direction: column;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 3.4rem;
    line-height: 1.12;
    color: #B3483C;
  }
  @media (max-width: 900px) {
    .left-calligraphy .col { font-size: 2rem; }
    .left-hero { left: 1.2rem; }
    .topnav .nav-links { display: none; }
  }
</style>
</head>
<body>
  <section class="hero-section" id="hero">
    <!-- Background -->
    <div class="hero-bg"></div>

    <!-- Top nav -->
    <nav class="topnav">
      <div class="brand" id="navBrand">琵琶行</div>
      <div class="nav-links">
        <a>Main</a>
        <a>Explorations</a>
        <a>Collaborations</a>
      </div>
    </nav>

    <!-- Cloth simulation: roof + physics canvas -->
    <div class="cloth-container" id="clothContainer">
      <img
        class="roof-img"
        id="roofImg"

        alt="Temple roof"
        draggable="false"
        onload="window.__roofLoaded = true; window.__initCloth && window.__initCloth();"
        onerror="window.__roofLoaded = true; window.__initCloth && window.__initCloth();"
      />
      <canvas class="cloth-canvas" id="clothCanvas"></canvas>
    </div>

    <!-- Left hero: poem label + vertical calligraphy -->
    <div class="left-hero">
      <div class="left-label" id="leftLabel">琵琶行 (Pípa Xíng) 白居易</div>
      <div class="left-calligraphy" id="leftCallig"></div>
    </div>

    <!-- Poem switcher -->
    <div class="poem-switcher">
      <button class="poem-btn active" data-poem="琵琶行">琵琶行</button>
      <button class="poem-btn" data-poem="长恨歌">长恨歌</button>
    </div>

    <!-- One-time sound unlock hint -->
    <div class="sound-hint" id="soundHint">点击任意处 · 开启声音</div>
  </section>

<script>

  };
  var currentPoem = '琵琶行';
  var CHARS = POEMS[currentPoem];
  var POEM_INFO = {
    '琵琶行': {
      label: '琵琶行 (Pípa Xíng) 白居易',
      callig: [
        ['浔', '阳', '江', '头', '夜', '送', '客'],
        ['枫', '叶', '荻', '花', '秋', '瑟', '瑟'],
        ['犹', '抱', '琵', '琶', '半', '遮', '面']
      ]
    },
    '长恨歌': {
      label: '长恨歌 (Cháng Hèn Gē) 白居易',
      callig: [
        ['汉', '皇', '重', '色', '思', '倾', '国'],
        ['御', '宇', '多', '年', '求', '不', '得'],
        ['天', '生', '丽', '质', '难', '自', '弃']
      ]
    }
  };
  var NOTES = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3];
  var INK = '#5C4640';

  var CFG = {
    gravity: 0.07,
    damping: 0.985,
    iterationsPerFrame: 5,
    verticalCompress: 0.02,
    verticalStretch: 1.3,
    horizCompress: 0.6,
    horizStretch: 4,
    mouseSize: 20000,
    mouseStrength: 42,
    grabRadius: 20
  };

  /* ---------------- DOM ---------------- */
  var container = document.getElementById('clothContainer');
  var roofImg = document.getElementById('roofImg');
  var canvas = document.getElementById('clothCanvas');
  var ctx = canvas.getContext('2d');

  /* ---------------- State ---------------- */
  var state = { gridW: 1, gridH: 1, cellWidth: 10, cellHeight: 10, dpr: 1 };
  var particles = [];
  var charCanvases = {};
  var rafId = null;
  var lastTime = 0;
  var pointer = { x: -1e9, y: -1e9, active: false };
  var grabbed = null;

  /* ---------------- Audio state ---------------- */
  var audioCtx = null;
  var lastPluckTime = 0;
  var lastPluckColumn = -1;
  var lastColumnTime = 0;

  /* ---------------- Breakpoints ---------------- */
  var currentBp = getBreakpoint();
  var lastWidth = window.innerWidth;

  function getBreakpoint() {
    var w = window.innerWidth;
    if (w < 640) return 'mobile';
    if (w < 1024) return 'tablet';
    return 'desktop';
  }

  function getGridConfig(bp) {
    if (bp === 'mobile') return { gridH: 12, height: 180, wFactor: 0.75 };
    if (bp === 'tablet') return { gridH: 16, height: 320, wFactor: 0.7 };
    return { gridH: 18, height: 360, wFactor: 0.68 };
  }

  /* ---------------- Character pre-render ---------------- */
  function preRenderChars(fontSize, dpr) {
    charCanvases = {};
    var box = Math.ceil(fontSize * 1.25);
    var ss = 2; /* supersample small glyphs for crispness */
    var uniq = Array.from(new Set(CHARS.split('')));
    for (var u = 0; u < uniq.length; u++) {
      var ch = uniq[u];
      var c = document.createElement('canvas');
      c.width = Math.ceil(box * dpr * ss);
      c.height = Math.ceil(box * dpr * ss);
      var g = c.getContext('2d');
      g.scale(dpr * ss, dpr * ss);
      g.font = 'bold ' + fontSize + 'px "Noto Serif SC", serif';
      g.fillStyle = INK;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(ch, box / 2, box / 2);
      charCanvases[ch] = { canvas: c, box: box };
    }
  }

  /* ---------------- Pointer helpers ---------------- */
  function toLocal(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function onPointerMove(e) {
    var p = toLocal(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
    ensureAudio();
    if (grabbed) {
      grabbed.x = grabbed.ox = p.x;
      grabbed.y = grabbed.oy = p.y;
    }
  }

  function onPointerDown(e) {
    var p = toLocal(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
    ensureAudio();
    var best = null;
    var bestD = CFG.grabRadius * CFG.grabRadius;
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      var dx = pt.x - p.x;
      var dy = pt.y - p.y;
      var d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; best = pt; }
    }
    if (best) {
      grabbed = best;
      grabbed.originalPinned = best.pinned;
      best.pinned = true;
    }
  }

  function onPointerUp() {
    if (grabbed) {
      grabbed.pinned = grabbed.originalPinned;
      grabbed = null;
    }
    pointer.active = false;
  }

  /* ---------------- Audio ---------------- */
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tryPluck(col) {
    var now = performance.now();
    if (now - lastPluckTime < 100) return;
    if (col === lastPluckColumn && now - lastColumnTime < 200) return;
    lastPluckTime = now;
    lastPluckColumn = col;
    lastColumnTime = now;
    var idx = ((col % 8) + 8) % 8;
    playPluck(NOTES[idx]);
  }

  function playPluck(freq) {
    var ac = ensureAudio();
    if (!ac) return;
    var t0 = ac.currentTime;
    var osc1 = ac.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    var osc2 = ac.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    var merger = ac.createChannelMerger(2);
    osc1.connect(merger, 0, 0);
    osc2.connect(merger, 0, 1);
    var filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 2;
    filter.frequency.setValueAtTime(4000, t0);
    filter.frequency.exponentialRampToValueAtTime(200, t0 + 0.8);
    var gain = ac.createGain();
    gain.gain.setValueAtTime(0.12, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.0);
    merger.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    osc1.start(t0);
    osc2.start(t0);
    osc1.stop(t0 + 1.0);
    osc2.stop(t0 + 1.0);
  }

  /* ---------------- Physics ---------------- */
  function smoothstep(edge0, edge1, x) {
    var t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  function solve(a, b, restLen, compressF, stretchF) {
    var dx = b.x - a.x;
    var dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    var minLen = restLen * (1 - compressF);
    var maxLen = restLen * stretchF;
    if (dist < minLen || dist > maxLen) {
      var target = dist < minLen ? minLen : maxLen;
      var diff = (dist - target) / dist;
      var ox = dx * diff * 0.5;
      var oy = dy * diff * 0.5;
      if (!a.pinned) { a.x += ox; a.y += oy; }
      if (!b.pinned) { b.x -= ox; b.y -= oy; }
    }
  }

  /* Horizontal spacer: only push particles apart when they get too close.
     No inward pull — columns stay free to swing like individual strings. */
  function solveSpring(a, b, restLen) {
    var dx = b.x - a.x;
    var dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    if (dist < restLen) {
      var diff = (dist - restLen) / dist;
      var ox = dx * diff * 0.22;
      var oy = dy * diff * 0.22;
      if (!a.pinned) { a.x += ox; a.y += oy; }
      if (!b.pinned) { b.x -= ox; b.y -= oy; }
    }
  }

  function idx(i, j) { return j * state.gridW + i; }

  function step(delta) {
    var dt2 = delta * delta;

    /* Mouse push force */
    var disturbedColumn = -1;
    if (pointer.active) {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        if (p.pinned) continue;
        var dx = p.x - pointer.x;
        var dy = p.y - pointer.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < CFG.mouseSize) {
          if (disturbedColumn < 0) disturbedColumn = Math.round(p.x / state.cellWidth);
          var angle = Math.atan2(pointer.y - p.y, pointer.x - p.x) - Math.PI;
          var strength = smoothstep(CFG.mouseSize, -2000, d2) * CFG.mouseStrength / 300;
          p.ax += Math.cos(angle) * strength;
          p.ay += Math.sin(angle) * strength;
        }
      }
    }
    if (pointer.active && disturbedColumn >= 0) tryPluck(disturbedColumn);

    /* Gentle ambient breeze: the whole curtain drifts like a bead curtain */
    var nowSec = performance.now() * 0.001;
    for (var b = 0; b < particles.length; b++) {
      var bp = particles[b];
      if (bp.pinned) continue;
      var colPhase = (b % state.gridW) * 0.35;
      var breeze = Math.sin(nowSec * 0.6 + bp.y * 0.018 + colPhase) * 0.012
                 + Math.sin(nowSec * 0.23 + bp.y * 0.01) * 0.008;
      bp.ax += breeze;
    }

    /* Verlet integration */
    for (var k = 0; k < particles.length; k++) {
      var q = particles[k];
      if (q.pinned) { q.ax = 0; q.ay = 0; continue; }
      var vx = (q.x - q.ox) * CFG.damping;
      var vy = (q.y - q.oy) * CFG.damping;
      q.ox = q.x;
      q.oy = q.y;
      q.ay += CFG.gravity / dt2;
      q.x += vx + q.ax * dt2;
      q.y += vy + q.ay * dt2;
      q.ax = 0;
      q.ay = 0;
    }

    /* Constraints */
    for (var iter = 0; iter < CFG.iterationsPerFrame; iter++) {
      for (var a = 0; a < particles.length; a++) {
        var pa = particles[a];
        if (!pa.down) continue;
        solve(pa, pa.down, state.cellHeight, CFG.verticalCompress, CFG.verticalStretch);
      }
      for (var j = 0; j < state.gridH; j++) {
        for (var i = 0; i < state.gridW - 1; i++) {
          solveSpring(particles[idx(i, j)], particles[idx(i + 1, j)], state.cellWidth);
        }
      }
    }
  }

  /* ---------------- Render ---------------- */
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var dpr = state.dpr;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.ch) continue;
      var rot = 0;
      if (p.down) {
        var dx = p.down.x - p.x;
        var dy = p.down.y - p.y;
        rot = Math.atan2(dy, dx) - Math.PI / 2;
      }
      var cc = charCanvases[p.ch];
      var box = cc.box;
      ctx.setTransform(dpr, 0, 0, dpr, p.x, p.y);
      ctx.rotate(rot);
      ctx.drawImage(cc.canvas, -box / 2, -box / 2, box, box);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---------------- Main loop ---------------- */
  function loop(now) {
    var delta = Math.min(Math.max((now - lastTime) / (1000 / 60), 0.25), 3);
    lastTime = now;
    step(delta);
    render();
    rafId = requestAnimationFrame(loop);
  }

  /* ---------------- Init / cleanup ---------------- */
  function cleanup() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    particles = [];
    grabbed = null;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerdown', onPointerDown);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    window.removeEventListener('resize', onResize);
  }

  var resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var bp = getBreakpoint();
      var w = window.innerWidth;
      if (bp !== currentBp || Math.abs(w - lastWidth) > 4) {
        currentBp = bp;
        lastWidth = w;
        if (window.__roofLoaded) init();
      }
    }, 150);
  }

  function init() {
    cleanup();

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cRect = container.getBoundingClientRect();
    var w = cRect.width;
    var h = cRect.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    /* Measure the roof's visible box (object-fit: contain may letterbox) */
    var visibleW, roofBottom;
    var rect = roofImg.getBoundingClientRect();
    var aspect = roofImg.naturalWidth / roofImg.naturalHeight;
    if (roofImg.naturalWidth > 0 && aspect > 0) {
      visibleW = Math.min(rect.width, rect.height * aspect);
      var visibleH = Math.min(rect.height, rect.width / aspect);
      roofBottom = rect.top - cRect.top + visibleH;
    } else {
      /* roof failed to load: fall back to a sensible anchor */
      visibleW = w * 0.45;
      roofBottom = h * 0.22;
    }

    var cfg = getGridConfig(currentBp);
    var stringAreaWidth = visibleW * cfg.wFactor;
    var stringAreaHeight = cfg.height;
    var gridH = cfg.gridH;
    var gridW = Math.ceil(CHARS.length / gridH) + 1;
    var cellWidth = stringAreaWidth / (gridW - 1);
    var cellHeight = stringAreaHeight / (gridH - 1);
    var originX = w / 2 - stringAreaWidth / 2;
    var originY = roofBottom - 14;

    state.gridW = gridW;
    state.gridH = gridH;
    state.cellWidth = cellWidth;
    state.cellHeight = cellHeight;
    state.dpr = dpr;

    var fontSize = Math.max(6, cellHeight * 0.36);
    preRenderChars(fontSize, dpr);

    particles = [];
    for (var j = 0; j < gridH; j++) {
      for (var i = 0; i < gridW; i++) {
        var x = originX + i * cellWidth;
        var y = originY + j * cellHeight;
        var pinned = j === 0;
        var charIndex = (gridW - 1 - i) * gridH + j;
        particles.push({
          x: x, y: y, ox: x, oy: y, ax: 0, ay: 0,
          pinned: pinned, originalPinned: pinned,
          ch: charIndex < CHARS.length ? CHARS[charIndex] : '',
          down: null
        });
      }
    }
    for (var jj = 0; jj < gridH - 1; jj++) {
      for (var ii = 0; ii < gridW; ii++) {
        particles[idx(ii, jj)].down = particles[idx(ii, jj + 1)];
      }
    }

    document.addEventListener('pointermove', onPointerMove, { passive: true });
    document.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('resize', onResize);

    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  /* ---------------- Poem switcher ---------------- */
  var soundHint = document.getElementById('soundHint');
  function unlockAudioOnce() {
    ensureAudio();
    if (soundHint) soundHint.classList.add('hide');
    document.removeEventListener('pointerdown', unlockAudioOnce);
  }
  document.addEventListener('pointerdown', unlockAudioOnce);

  var poemButtons = document.querySelectorAll('.poem-btn');
  function renderLeftHero(name) {
    var info = POEM_INFO[name];
    if (!info) return;
    document.getElementById('leftLabel').textContent = info.label;
    document.getElementById('navBrand').textContent = name;
    var box = document.getElementById('leftCallig');
    box.innerHTML = '';
    for (var c = 0; c < info.callig.length; c++) {
      var col = document.createElement('div');
      col.className = 'col';
      var chars = info.callig[c];
      for (var k = 0; k < chars.length; k++) {
        var s = document.createElement('span');
        s.textContent = chars[k];
        col.appendChild(s);
      }
      box.appendChild(col);
    }
  }
  renderLeftHero(currentPoem);
  poemButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      poemButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPoem = btn.getAttribute('data-poem');
      CHARS = POEMS[currentPoem];
      renderLeftHero(currentPoem);
      if (window.__roofLoaded) init();
    });
  });

  /* ---------------- Bootstrap ---------------- */
  window.__initCloth = function () {
    var run = function () {
      if (window.__roofLoaded) init();
    };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(run);
    } else {
      run();
    }
  };
  if (roofImg.complete) window.__roofLoaded = true;
  if (window.__roofLoaded) window.__initCloth();
})();
</script>
</body>
</html>
